# Databricks Asset Bundle: defines the pipeline jobs as code.
#
#   databricks bundle validate            # check config
#   databricks bundle deploy -t dev       # deploy dev copy (schedule paused, writes to aq_dev)
#   databricks bundle run aq_hourly       # trigger a run of the dev copy
#   databricks bundle deploy -t prod      # deploy scheduled copy (writes to aq)
#
# Tasks are added here as their notebooks are built (see README → Roadmap).

bundle:
  name: aq_utah_project

variables:
  catalog:
    description: Unity Catalog catalog for all tables
    default: workspace
  schema:
    description: Schema for bronze/silver/gold tables, volumes, and checkpoints
    default: aq
  extractor_principal:
    description: Application ID of the aq-extractor service principal (GitHub Actions), granted the landing volume
    default: 46a6ea02-9d8c-4457-9bc8-b14e29815b3a

resources:
  jobs:
    aq_hourly:
      name: aq_hourly
      # Every run MERGEs into the same tables, and streaming checkpoints can't be shared by two runs at once.
      max_concurrent_runs: 1
      # Standard mode bills less per run than performance-optimized, in exchange for a slower start. A batch
      # job that runs every few hours doesn't need the faster start.
      performance_target: STANDARD
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: extractor_principal
          default: ${var.extractor_principal}
        # incremental: recompute the last 14 days. full: rebuild gold from 2024-01-22 (e.g. after adding a feature).
        - name: gold_mode
          default: incremental
      trigger:
        # The GitHub Actions extractor lands one file per hour. The job runs when files arrive, so there's no
        # clock to keep in sync between GitHub and Databricks.
        file_arrival:
          url: /Volumes/${var.catalog}/${var.schema}/landing/raw/
          wait_after_last_change_seconds: 60
          # At most one run per ~3 hours, which processes every file that landed since the last run. Forecasts
          # are 24-72 h ahead, so inputs a few hours old barely change them, and this cuts runs from ~720 to
          # ~240 a month. (Just under 3 h, so the file landing at the 3-hour mark still triggers a run.)
          min_time_between_triggers_seconds: 10500
        # Paused until the ingest → features → export tasks exist. Unpause in prod once they do.
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      # No cluster specified, so every task runs on serverless compute.
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ./notebooks/00_setup.py

        - task_key: bronze
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: ./notebooks/01_bronze_ingest.py
            base_parameters:
              run_id: "{{job.run_id}}"
          max_retries: 1
          min_retry_interval_millis: 60000

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/02_silver.py
            base_parameters:
              run_id: "{{job.run_id}}"
          max_retries: 1
          min_retry_interval_millis: 60000

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/03_gold.py
            base_parameters:
              run_id: "{{job.run_id}}"
              mode: "{{job.parameters.gold_mode}}"
          max_retries: 1
          min_retry_interval_millis: 60000

    aq_weekly_train:
      name: aq_weekly_train
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      schedule:
        # Mondays 11:00 UTC (4am MST), after a full weekend of hourly data.
        quartz_cron_expression: "0 0 11 ? * MON"
        timezone_id: UTC
        # Paused until the hourly pipeline runs in prod; dev mode pauses it anyway.
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      # Python script tasks (not notebooks) so each can pin a serverless environment: notebook tasks get the
      # workspace default, which here is Python 3.10 without LightGBM, PyTorch, or MLflow.
      environments:
        - environment_key: lightgbm
          spec:
            environment_version: "4"
            dependencies:
              - lightgbm==4.7.0
              - mlflow==3.18.0
        - environment_key: gru
          spec:
            environment_version: "4"
            dependencies:
              # CPU-only build: ~200 MB instead of ~2.5 GB of CUDA libraries serverless CPUs can't use.
              # Serverless can land on x86 or ARM machines, so both wheels are listed with platform markers.
              - "torch @ https://download.pytorch.org/whl/cpu/torch-2.15.0%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl ; platform_machine == 'x86_64'"
              - "torch @ https://download.pytorch.org/whl/cpu/torch-2.15.0%2Bcpu-cp312-cp312-manylinux_2_28_aarch64.whl ; platform_machine == 'aarch64'"
              - mlflow==3.18.0
      # The two families train in parallel, and one failing doesn't stop the other's promotion.
      tasks:
        - task_key: train_lightgbm
          environment_key: lightgbm
          spark_python_task:
            python_file: ./training/train_job.py
            parameters: [--model, lightgbm, --catalog, "{{job.parameters.catalog}}", --schema, "{{job.parameters.schema}}", --run-id, "{{job.run_id}}"]
        - task_key: train_gru
          environment_key: gru
          spark_python_task:
            python_file: ./training/train_job.py
            parameters: [--model, gru, --catalog, "{{job.parameters.catalog}}", --schema, "{{job.parameters.schema}}", --run-id, "{{job.run_id}}"]

targets:
  dev:
    # Development mode prefixes the job name with [dev <user>] and pauses its schedule.
    mode: development
    default: true
    variables:
      schema: aq_dev

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
