# Databricks Asset Bundle: defines the pipeline jobs as code.
#
#   databricks bundle validate            # check config
#   databricks bundle deploy -t dev       # deploy dev copy (schedule paused, writes to aq_dev)
#   databricks bundle run aq_hourly       # trigger a run of the dev copy
#   databricks bundle deploy -t prod      # deploy scheduled copy (writes to aq)
#
# Tasks are added here as their notebooks are built (see README → Roadmap).

bundle:
  name: aq_utah_project

variables:
  catalog:
    description: Unity Catalog catalog for all tables
    default: workspace
  schema:
    description: Schema for bronze/silver/gold tables, volumes, and checkpoints
    default: aq
  hf_dataset:
    description: Hugging Face dataset repo the serving task exports forecasts to
    default: itstheryguy/aq-utah-forecasts
  hf_model_repo:
    description: Hugging Face model repo the training job publishes champions to
    default: itstheryguy/aq-utah-models
  extractor_principal:
    description: Application ID of the aq-extractor service principal (GitHub Actions), granted the landing volume
    default: 46a6ea02-9d8c-4457-9bc8-b14e29815b3a

resources:
  jobs:
    aq_hourly:
      name: aq_hourly
      # Every run MERGEs into the same tables, and streaming checkpoints can't be shared by two runs at once.
      max_concurrent_runs: 1
      # Standard mode bills less per run than performance-optimized, in exchange for a slower start. A batch
      # job that runs every few hours doesn't need the faster start.
      performance_target: STANDARD
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: extractor_principal
          default: ${var.extractor_principal}
        # incremental: recompute the last 14 days. full: rebuild gold from 2024-01-22 (e.g. after adding a feature).
        - name: gold_mode
          default: incremental
        # Public dataset the Space reads. Empty skips the export (e.g. for a scratch copy of the pipeline).
        - name: hf_dataset
          default: ${var.hf_dataset}
      trigger:
        # The GitHub Actions extractor lands one file per hour. The job runs when files arrive, so there's no
        # clock to keep in sync between GitHub and Databricks.
        file_arrival:
          url: /Volumes/${var.catalog}/${var.schema}/landing/raw/
          wait_after_last_change_seconds: 60
          # At most one run per ~3 hours, which processes every file that landed since the last run. Forecasts
          # are 24-72 h ahead, so inputs a few hours old barely change them, and this cuts runs from ~720 to
          # ~240 a month. (Just under 3 h, so the file landing at the 3-hour mark still triggers a run.)
          min_time_between_triggers_seconds: 10500
        # Paused by default; the prod target unpauses it (see targets), so dev runs only when started by hand.
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      # Every task on environment version 4. Mixing versions (notebook tasks default to the workspace's
      # version 1) stops serverless from reusing compute between tasks, which makes each run slower.
      environments:
        - environment_key: base
          spec:
            environment_version: "4"
        - environment_key: serving
          spec:
            environment_version: "4"
            dependencies:
              - lightgbm==4.7.0
              - mlflow==3.18.0
              - huggingface_hub==2.4.0
              - "torch @ https://download.pytorch.org/whl/cpu/torch-2.15.0%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl ; platform_machine == 'x86_64'"
              - "torch @ https://download.pytorch.org/whl/cpu/torch-2.15.0%2Bcpu-cp312-cp312-manylinux_2_28_aarch64.whl ; platform_machine == 'aarch64'"
      # No cluster specified, so every task runs on serverless compute.
      tasks:
        - task_key: setup
          environment_key: base
          notebook_task:
            notebook_path: ./notebooks/00_setup.py

        - task_key: bronze
          depends_on:
            - task_key: setup
          environment_key: base
          notebook_task:
            notebook_path: ./notebooks/01_bronze_ingest.py
            base_parameters:
              run_id: "{{job.run_id}}"
          max_retries: 1
          min_retry_interval_millis: 60000

        - task_key: silver
          depends_on:
            - task_key: bronze
          environment_key: base
          notebook_task:
            notebook_path: ./notebooks/02_silver.py
            base_parameters:
              run_id: "{{job.run_id}}"
          max_retries: 1
          min_retry_interval_millis: 60000

        - task_key: gold
          depends_on:
            - task_key: silver
          environment_key: base
          notebook_task:
            notebook_path: ./notebooks/03_gold.py
            base_parameters:
              run_id: "{{job.run_id}}"
              mode: "{{job.parameters.gold_mode}}"
          max_retries: 1
          min_retry_interval_millis: 60000

        # Batch inference + export to Hugging Face. A Python script task, so it can pin an environment with
        # the model libraries (same as aq_weekly_train). Both families score in one process: the OpenMP
        # conflict between LightGBM and PyTorch is macOS-only.
        - task_key: score
          depends_on:
            - task_key: gold
          environment_key: serving
          spark_python_task:
            python_file: ./serving/score_job.py
            parameters: [--catalog, "{{job.parameters.catalog}}", --schema, "{{job.parameters.schema}}", --run-id, "{{job.run_id}}", --hf-dataset, "{{job.parameters.hf_dataset}}"]
          max_retries: 1
          min_retry_interval_millis: 60000

    aq_weekly_train:
      name: aq_weekly_train
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: hf_model_repo
          default: ${var.hf_model_repo}
      schedule:
        # Mondays 11:00 UTC (4am MST), after a full weekend of hourly data.
        quartz_cron_expression: "0 0 11 ? * MON"
        timezone_id: UTC
        # Paused by default; the prod target unpauses it.
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      # Python script tasks (not notebooks) so each can pin a serverless environment: notebook tasks get the
      # workspace default, which here is Python 3.10 without LightGBM, PyTorch, or MLflow.
      environments:
        - environment_key: lightgbm
          spec:
            environment_version: "4"
            dependencies:
              - lightgbm==4.7.0
              - mlflow==3.18.0
              - huggingface_hub==2.4.0
        - environment_key: gru
          spec:
            environment_version: "4"
            dependencies:
              # CPU-only build: ~200 MB instead of ~2.5 GB of CUDA libraries serverless CPUs can't use.
              # Serverless can land on x86 or ARM machines, so both wheels are listed with platform markers.
              - "torch @ https://download.pytorch.org/whl/cpu/torch-2.15.0%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl ; platform_machine == 'x86_64'"
              - "torch @ https://download.pytorch.org/whl/cpu/torch-2.15.0%2Bcpu-cp312-cp312-manylinux_2_28_aarch64.whl ; platform_machine == 'aarch64'"
              - mlflow==3.18.0
      # The two families train in parallel, and one failing doesn't stop the other's promotion.
      tasks:
        - task_key: train_lightgbm
          environment_key: lightgbm
          spark_python_task:
            python_file: ./training/train_job.py
            parameters: [--model, lightgbm, --catalog, "{{job.parameters.catalog}}", --schema, "{{job.parameters.schema}}", --run-id, "{{job.run_id}}"]
        - task_key: train_gru
          environment_key: gru
          spark_python_task:
            python_file: ./training/train_job.py
            parameters: [--model, gru, --catalog, "{{job.parameters.catalog}}", --schema, "{{job.parameters.schema}}", --run-id, "{{job.run_id}}"]
        # Publishes whichever champions changed, even if one family's training failed.
        - task_key: publish
          depends_on:
            - task_key: train_lightgbm
            - task_key: train_gru
          run_if: AT_LEAST_ONE_SUCCESS
          environment_key: lightgbm
          spark_python_task:
            python_file: ./training/publish_job.py
            parameters: [--catalog, "{{job.parameters.catalog}}", --schema, "{{job.parameters.schema}}", --hf-repo, "{{job.parameters.hf_model_repo}}"]

targets:
  dev:
    # Development mode prefixes job names with [dev <user>]. Triggers stay paused (the default above).
    mode: development
    default: true
    variables:
      schema: aq_dev
      # Dev never publishes: the public dataset and model repo are what the live Space and readers use.
      hf_dataset: ""
      hf_model_repo: ""

  prod:
    mode: production
    # The only place schedules run. (Development mode doesn't pause a trigger that sets its status explicitly,
    # so the safe default is PAUSED in the job definitions, overridden here.)
    resources:
      jobs:
        aq_hourly:
          trigger:
            pause_status: UNPAUSED
        aq_weekly_train:
          schedule:
            pause_status: UNPAUSED
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
